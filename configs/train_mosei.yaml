base:
  alpha: 0.9
  batch_size: 64
  beta: 0.8
  do_validation: true
  gamma: 0.1
  lambda: 0.0001
  lr: 0.0001
  missing_rate_eval_test: 0.5
  n_epochs: 100
  num_workers: 8
  seed: 1111
  sigma: 1.0
  train_mode: regression
  weight_decay: 0.0001
dataset:
  dataPath: /home/icdm/wyt/datasets/mosei/Processed/unaligned_50.pkl
  datasetName: mosei
model:
  dmc:
    completeness_check:
      depth: 2
      heads: 8
      hidden_dim: 128
      input_dim: 128
      input_length: 8
      token_length: 1
    effectiveness_discriminator:
      hidden_dim: 64
      input_dim: 128
      out_dim: 2
    proxy_dominant_feature_generator:
      depth: 2
      heads: 8
      hidden_dim: 128
      input_dim: 128
      input_length: 24
      token_length: 8
  dmml:
    cross_bipolar_attention:
      heads: 8
      hidden_dim: 128
    hyper_modality_learning:
      depth: 3
      heads: 8
      hidden_dim: 128
      input_dim: 128
    language_encoder:
      depth: 2
      heads: 8
      hidden_dim: 128
      input_dim: 128
      input_length: 8
      token_length: 8
  feature_extractor:
    bert_pretrained: bert-base-uncased
    depth: 2
    heads: 8
    hidden_dims:
    - 128
    - 128
    - 128
    input_dims:
    - 768
    - 35
    - 74
    input_length:
    - 50
    - 500
    - 500
    token_length:
    - 8
    - 8
    - 8
  nig_evidence:
    nig_mlp1:
      input_dim1: 128
      output_dim1: 4
    nig_mlp2:
      input_dim2: 128
      output_dim2: 4
  reconstructor:
    depth: 2
    heads: 8
    hidden_dim: 128
    input_dim: 128
    input_length: 8
